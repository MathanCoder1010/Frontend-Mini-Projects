<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Color Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <div class="icon">🎨</div>

    <h1>Random Color <span>Generator</span></h1>
    <p class="subtitle">Generate beautiful random colors with a single click</p>

    <div class="color-box" id="colorBox"></div>

    <div class="code-box">
      <span id="colorCode">#9A7DFF</span>
      <button class="copy-btn" onclick="copyColor()">📋</button>
    </div>

    <button class="generate-btn" onclick="generateColor()">
      🔄 Generate New Color
    </button>

    <div class="features">
      <div>
        <span>✨</span>
        <p>Random</p>
      </div>
      <div>
        <span>📄</span>
        <p>Copy</p>
      </div>
      <div>
        <span>🎯</span>
        <p>Beautiful</p>
      </div>
    </div>

    <div class="footer">
      Made with ❤️ by <span>Mathan</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
